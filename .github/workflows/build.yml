name: Auto-Unzip & Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "apex-auto-unzip"
  cancel-in-progress: false

jobs:
  build-web:
    name: 1A. Auto-Unzip & Prepare Live Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate & Extract Web Files
        run: |
          mkdir -p _work _site
          ZIPS=$(find . -not -path './.git/*' -type f -iname '*.zip')
          if [ -n "$ZIPS" ]; then
            echo "$ZIPS" | while IFS= read -r f; do
              ts=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
              printf "%s\t%s\n" "$ts" "$f"
            done | sort -n | cut -f2- | while IFS= read -r z; do
              echo "Extracting: $z"
              unzip -qo "$z" -d _work
            done
          else
            find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '_work' -not -name '_site' -exec cp -r {} _work/ \;
          fi

          HTML_PATH=$(find _work -maxdepth 3 -name 'index.html' -not -path '*/android/*' | head -n 1)
          WEB_DIR=$(dirname "$HTML_PATH")
          cp "$WEB_DIR/index.html" _site/
          for f in manifest.json sw.js version.json icon.svg icon-192.png icon-512.png; do
            [ -f "$WEB_DIR/$f" ] && cp "$WEB_DIR/$f" _site/ || true
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy-pages:
    name: 1B. Publish Live Auto-Update Site
    needs: build-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: 2. Auto-Unzip & Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate & Extract Android Project
        id: prep
        run: |
          mkdir -p _work
          ZIPS=$(find . -not -path './.git/*' -type f -iname '*.zip')
          if [ -n "$ZIPS" ]; then
            echo "$ZIPS" | while IFS= read -r f; do
              ts=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
              printf "%s\t%s\n" "$ts" "$f"
            done | sort -n | cut -f2- | while IFS= read -r z; do
              echo "Extracting: $z"
              unzip -qo "$z" -d _work
            done
          else
            find . -maxdepth 1 -not -name '.' -not -name '.git' -not -name '_work' -exec cp -r {} _work/ \;
          fi

          GRADLE_FILE=$(find _work -maxdepth 4 -name 'settings.gradle' | head -n 1)
          HTML_PATH=$(find _work -maxdepth 3 -name 'index.html' -not -path '*/android/*' | head -n 1)
          ANDROID_DIR=$(dirname "$GRADLE_FILE")
          WEB_DIR=$(dirname "$HTML_PATH")
          echo "android_dir=$ANDROID_DIR" >> $GITHUB_OUTPUT

          mkdir -p "$ANDROID_DIR/app/src/main/assets"
          cp "$WEB_DIR/index.html" "$ANDROID_DIR/app/src/main/assets/index.html"
          [ -f "$WEB_DIR/icon-192.png" ] && cp "$WEB_DIR/icon-192.png" "$ANDROID_DIR/app/src/main/res/mipmap-xhdpi/ic_launcher.png" || true
          [ -f "$WEB_DIR/icon-512.png" ] && cp "$WEB_DIR/icon-512.png" "$ANDROID_DIR/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Installable Android APK
        working-directory: ${{ steps.prep.outputs.android_dir }}
        env:
          APEX_APP_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          APEX_VERSION_NAME: "9.0.${{ github.run_number }}"
          APEX_VERSION_CODE: "${{ github.run_number }}"
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "${{ steps.prep.outputs.android_dir }}/app/build/outputs/apk/debug/app-debug.apk" APEX-Quantum-AutoUpdate.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Quantum-APK
          path: APEX-Quantum-AutoUpdate.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v9.0.${{ github.run_number }}"
          name: "APEX Quantum v9.0.${{ github.run_number }} (Auto-Updating APK)"
          body: "APEX Quantum v9 Auto-Updating Android APK"
          files: APEX-Quantum-AutoUpdate.apk
