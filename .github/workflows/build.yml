name: Auto-Unzip & Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "apex-auto-unzip"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: 1. Auto-Unzip & Deploy Live Web
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for uploaded ZIP
        id: check
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "has_zip=true" >> $GITHUB_OUTPUT
          else
            echo "has_zip=false" >> $GITHUB_OUTPUT
            echo "Waiting for ZIP upload..."
          fi

      - name: Auto-Unzip uploaded ZIP files
        if: steps.check.outputs.has_zip == 'true'
        run: |
          mkdir -p _work _site
          find . -maxdepth 1 -name '*.zip' -print0 | while IFS= read -r -d '' f; do
            ts=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            printf "%s\t%s\n" "$ts" "$f"
          done | sort -n | cut -f2- | while IFS= read -r z; do
            echo "Extracting $z..."
            unzip -qo "$z" -d _work
          done
          cp _work/index.html _site/
          for ext in manifest.json sw.js version.json icon.svg icon-192.png icon-512.png; do
            [ -f "_work/$ext" ] && cp "_work/$ext" _site/ || true
          done

      - name: Setup GitHub Pages
        if: steps.check.outputs.has_zip == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check.outputs.has_zip == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.check.outputs.has_zip == 'true'
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: 2. Auto-Unzip & Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for uploaded ZIP
        id: check
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "has_zip=true" >> $GITHUB_OUTPUT
          else
            echo "has_zip=false" >> $GITHUB_OUTPUT
            echo "Waiting for ZIP upload..."
          fi

      - name: Auto-Unzip & prepare Android project
        if: steps.check.outputs.has_zip == 'true'
        run: |
          mkdir -p _work
          find . -maxdepth 1 -name '*.zip' -print0 | while IFS= read -r -d '' f; do
            ts=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            printf "%s\t%s\n" "$ts" "$f"
          done | sort -n | cut -f2- | while IFS= read -r z; do
            echo "Extracting $z..."
            unzip -qo "$z" -d _work
          done
          mkdir -p _work/android/app/src/main/assets
          cp _work/index.html _work/android/app/src/main/assets/index.html
          [ -f "_work/icon-192.png" ] && cp _work/icon-192.png _work/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          [ -f "_work/icon-512.png" ] && cp _work/icon-512.png _work/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Setup JDK 17
        if: steps.check.outputs.has_zip == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        if: steps.check.outputs.has_zip == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Installable Android APK
        if: steps.check.outputs.has_zip == 'true'
        working-directory: _work/android
        env:
          APEX_APP_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          APEX_VERSION_NAME: "9.0.${{ github.run_number }}"
          APEX_VERSION_CODE: "${{ github.run_number }}"
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        if: steps.check.outputs.has_zip == 'true'
        run: cp _work/android/app/build/outputs/apk/debug/app-debug.apk APEX-Quantum-AutoUpdate.apk

      - name: Upload APK Artifact
        if: steps.check.outputs.has_zip == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: APEX-Quantum-APK
          path: APEX-Quantum-AutoUpdate.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: steps.check.outputs.has_zip == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v9.0.${{ github.run_number }}"
          name: "APEX Quantum v9.0.${{ github.run_number }} (Auto-Updating APK)"
          body: "ZIP එක Unzip නොකරම GitHub හරහා ස්වයංක්‍රීයව Build වූ APEX Quantum Android APK එක."
          files: APEX-Quantum-AutoUpdate.apk
